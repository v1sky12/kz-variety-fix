name: Validate place and movement
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Build pinned Luau tools
        run: |
          git init /tmp/luau
          git -C /tmp/luau remote add origin https://github.com/luau-lang/luau.git
          git -C /tmp/luau fetch --depth 1 origin 9d7748a4f324213a18cb8283fa2a77c330225fa0
          git -C /tmp/luau checkout --detach FETCH_HEAD
          make -C /tmp/luau config=release luau luau-compile -j2
      - run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -B run_luau_tests.py --luau /tmp/luau/luau
      - name: Install pinned independent RBXL reader
        run: |
          python - <<'PY'
          import hashlib, io, pathlib, urllib.request, zipfile
          url = 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip'
          data = urllib.request.urlopen(url).read()
          assert hashlib.sha256(data).hexdigest() == '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4'
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              assert archive.testzip() is None
              path = pathlib.Path('/tmp/kz-rojo/rojo')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(archive.read('rojo'))
              path.chmod(0o755)
          PY
      - run: python -B build_place.py --check --luau-compile /tmp/luau/luau-compile --rojo /tmp/kz-rojo/rojo
      - name: Install pinned Lune for Roblox float32 and map tests
        run: python -B tools/install_lune.py --target /tmp/kz-lune/lune
      - run: /tmp/kz-lune/lune run tools/float32_regressions.luau
      - run: /tmp/kz-lune/lune run tools/surf_ascent_regressions.luau
      - run: /tmp/kz-lune/lune run tools/audit_scene.luau
      - run: /tmp/kz-lune/lune run tools/verify_scene.luau
      - run: /tmp/kz-lune/lune run tools/water_map_probe.luau
      - run: /tmp/kz-lune/lune run tools/water_exit_probe.luau
      - run: /tmp/kz-lune/lune run tools/water_surface_probe.luau
      - run: /tmp/kz-lune/lune run tools/water_contact_probe.luau
      - run: /tmp/kz-lune/lune run tools/water_server_probe.luau
      - run: /tmp/kz-lune/lune run tools/route_blocks_probe.luau
      - run: /tmp/kz-lune/lune run tools/conveyor_map_probe.luau
      - run: /tmp/kz-lune/lune run tools/surf_map_probe.luau
      - run: /tmp/kz-lune/lune run tools/surf_uphill_map_probe.luau
      - run: /tmp/kz-lune/lune run tools/teleport_audit.luau
